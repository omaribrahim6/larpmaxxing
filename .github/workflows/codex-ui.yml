name: Codex UI isolated tests
on:
  push:
    paths:
      - 'src/client/CodexUI/**'
      - 'src/config/UIConfig.lua'
      - 'tests/PlayerExperience*'
      - 'tests/InputControllerFixture.luau'
      - 'tests/SettingsRoundTrip.client.lua'
      - 'tools/test-codex-ui.py'
      - '.github/workflows/codex-ui.yml'
  pull_request:
    paths:
      - 'src/client/CodexUI/**'
      - 'src/config/UIConfig.lua'
      - 'tests/PlayerExperience*'
      - 'tests/InputControllerFixture.luau'
      - 'tests/SettingsRoundTrip.client.lua'
      - 'tools/test-codex-ui.py'
      - '.github/workflows/codex-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Luau CLI
        shell: bash
        run: |
          mkdir -p .local/tools/luau
          curl --fail --location --retry 3 https://github.com/luau-lang/luau/releases/download/0.737/luau-ubuntu.zip --output .local/tools/luau.zip
          echo 'c3f000d0bb190301b9548f50f82ae9e217a8b5ba7b3551b038dbf28cb2e5ed32  .local/tools/luau.zip' | sha256sum --check
          unzip -q .local/tools/luau.zip -d .local/tools/luau
          chmod +x .local/tools/luau/luau .local/tools/luau/luau-compile
      - name: Test pure state and input adapter, compile owned sources
        run: python3 tools/test-codex-ui.py --luau .local/tools/luau/luau
